<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ec">
<!--HEAD-->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230b0f1a'/><path d='M8.4 10.6 16 16 23.8 8.8M16 16 12.4 24M16 16 24.6 20.4' fill='none' stroke='%23c9a227' stroke-width='1.2' stroke-linecap='round'/><circle cx='8.4' cy='10.6' r='2' fill='%23d9b45b'/><circle cx='23.8' cy='8.8' r='1.6' fill='%23d9b45b'/><circle cx='12.4' cy='24' r='1.6' fill='%23d9b45b'/><circle cx='24.6' cy='20.4' r='1.4' fill='%23d9b45b'/><path d='M16 10.9l1.4 3.7 3.7 1.4-3.7 1.4-1.4 3.7-1.4-3.7-3.7-1.4 3.7-1.4z' fill='%23f0d590'/></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#fbf7ec; --bg2:#fffdf7; --paper:#ffffff;
  --ink:#231f18; --ink2:#3f3930;
  --gold:#c19a2e; --gold2:#a07c1c; --gold-dim:#a8873a; --gold-soft:#fdf4dc;
  --txt:#231f18; --dim:#7a7365; --dim2:#a49b8a;
  --line:rgba(60,48,16,.11); --line2:rgba(60,48,16,.19);
  --card:#ffffff;
  --sh:0 1px 2px rgba(70,56,20,.05),0 8px 26px rgba(70,56,20,.06);
  --e0:#4ea87a; --e1:#e2734a; --e2:#d0a94f; --e3:#9fb0c4; --e4:#4f86c6;
  --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Pretendard Variable',Pretendard,system-ui,'Malgun Gothic',sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.022em; overflow-x:hidden;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
@supports (font:-apple-system-body){ body{font-family:-apple-system,'Pretendard Variable',Pretendard,sans-serif} }
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(760px 420px at 50% -8%, rgba(217,180,91,.16), transparent 66%),
    radial-gradient(620px 420px at 8% 30%, rgba(217,180,91,.07), transparent 62%),
    linear-gradient(180deg,#fdfaf1 0%,#fbf7ec 42%,#f8f3e6 100%);
}
.wrap{max-width:540px;margin:0 auto;padding:0 22px calc(120px + var(--safe-b))}
a{color:inherit;text-decoration:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:40;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  background:rgba(253,250,242,.92);
  border-bottom:1px solid rgba(150,120,40,.16);
  padding-top:var(--safe-t)}
.hdr{max-width:540px;margin:0 auto;padding:13px 22px 10px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:31px;height:31px;flex:0 0 31px;display:block}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.17em;
  color:var(--gold-dim);text-transform:none}
.logo .wm b{font-size:21px;font-weight:800;letter-spacing:-.05em;color:#1d1a14;margin-top:3px;white-space:nowrap}
.hdr .sp{flex:1}
.ghost{border:1px solid rgba(60,48,16,.18);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
  color:#5f5849;background:#fff;transition:.15s;white-space:nowrap}
.ghost:hover{color:var(--gold2);border-color:rgba(193,154,46,.55)}

/* 별자리 메뉴 */
/* 토정비결 */
.quick{background:linear-gradient(155deg,#fdf4da,#fffdf7 62%);border:1px solid rgba(193,154,46,.32);
  border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(70,56,20,.05)}
.quick .qt{font-size:14.5px;color:#4a4438;letter-spacing:-.02em;margin-bottom:13px;text-align:center}
.quick .qt b{font-weight:700;color:#231f18}
.intro{background:linear-gradient(155deg,#fdf6e2,#fff 58%);border-color:rgba(193,154,46,.28)}
.uphint{margin-top:16px;display:flex;align-items:flex-start;gap:8px;padding:11px 15px;border-radius:16px;
  font-size:13.5px;font-weight:600;letter-spacing:-.025em;color:#5a4408;line-height:1.6;
  background:linear-gradient(180deg,#fdf3d4,#f7e6ae);border:1px solid rgba(160,124,28,.32)}
.uphint .tx{flex:1;min-width:0}
.uphint .tx b{color:#7a5c08;font-weight:800}
.uphint .ar{flex:0 0 auto;font-size:16px;font-weight:800;line-height:1.35;animation:upar 1.4s var(--ease) infinite}
@keyframes upar{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.uphint .ar{animation:none}}
.gwae{position:relative;border-radius:24px;padding:26px 22px 24px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 90% at 50% -10%,rgba(217,180,91,.22),transparent 62%),
    linear-gradient(180deg,#131a2c,#0a0f1c 60%);
  border:1px solid rgba(217,180,91,.30);box-shadow:0 14px 40px rgba(30,24,8,.2)}
.gwnum{font-size:12px;font-weight:800;letter-spacing:.24em;color:#8a7c5c}
.gwname{margin-top:9px;font-size:23px;font-weight:700;letter-spacing:-.03em;color:#f2dfa5}
.gwverse{margin-top:16px;padding-top:15px;border-top:1px solid rgba(217,180,91,.22);
  display:flex;flex-direction:column;gap:7px}
.gwverse div{font-size:14.5px;line-height:1.65;color:#dfe4ee;letter-spacing:-.02em}
.gwverse div:nth-child(odd){color:#c1c9d8}
.mlist{display:flex;flex-direction:column;gap:7px}
.mrow2{display:grid;grid-template-columns:40px 36px auto;gap:3px 9px;align-items:baseline;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  box-shadow:0 1px 2px rgba(70,56,20,.04)}
.mrow2 .mm{font-size:14px;font-weight:800;letter-spacing:-.03em;color:#231f18}
.mrow2 .mgz{font-size:12.5px;color:var(--dim2)}
.mrow2 .mtag{font-size:12px;font-weight:700}
.mrow2 .mtx{grid-column:1/-1;font-size:13.5px;line-height:1.6;color:#4a4438;margin-top:3px}
.navsky{max-width:540px;margin:0 auto;padding:14px 20px 2px;position:relative}
.navsky::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 68% at 50% 38%,rgba(217,180,91,.13),transparent 70%)}
.navsky svg{display:block;width:100%;height:auto;overflow:visible;position:relative}
.navnote{position:relative;margin:10px auto 0;max-width:420px;text-align:center;
  font-size:11.8px;line-height:1.6;letter-spacing:-.03em;color:var(--dim);word-break:keep-all}
.navnote b{color:#a07c1c;font-weight:700}
.whobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;
  padding:9px 13px;border-radius:13px;background:#fff;border:1px solid var(--line)}
.whobar .w1{flex:1;min-width:0;font-size:12.5px;letter-spacing:-.03em;color:var(--dim);word-break:keep-all}
.whobar .w1 b{color:var(--ink);font-weight:700}
.whobar .w2{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:-.03em;color:#a07c1c;
  text-decoration:none;background:var(--gold-soft);border-radius:999px;padding:5px 10px}
.whobar .w2:active{transform:scale(.97)}
.cpr{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;line-height:1.7;color:var(--dim2);letter-spacing:-.02em}
.cpr b{color:var(--dim);font-weight:700}
.cpr span{display:block;margin-top:5px;font-size:11.5px;color:var(--dim2);word-break:keep-all}
.sitefoot{margin-top:38px;padding:26px 18px calc(112px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(255,255,255,.5)}
.sfin{max-width:540px;margin:0 auto;text-align:center}
.sfb{font-size:13.5px;font-weight:800;letter-spacing:-.04em;color:var(--dim)}
.sfb i{font-style:normal;font-weight:600;color:var(--dim2);margin-left:4px}
.sfl{margin-top:11px;display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap}
.sfl a{font-size:12.5px;color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.sfl span{color:var(--dim2);font-size:11px}
.sfc{margin-top:14px;font-size:12.5px;color:var(--dim2);letter-spacing:-.02em}
.sfc b{color:var(--dim);font-weight:800}
.sfadm{color:rgba(122,115,101,.5);text-decoration:none;font-size:11px;margin-left:6px;border-bottom:1px dotted rgba(122,115,101,.35)}
.sfadm:hover{color:var(--dim)}
.sfn{margin-top:7px;font-size:11.5px;line-height:1.7;color:var(--dim2);word-break:keep-all}
.btlbox{border-radius:20px;padding:16px 17px 15px;border:1px solid rgba(193,154,46,.34);
  background:linear-gradient(155deg,rgba(217,180,91,.16),#fffdf7 62%);box-shadow:var(--sh)}
.btag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;color:#fffaf0;
  background:linear-gradient(135deg,#c9a227,#a07c1c);border-radius:999px;padding:5px 12px}
.bhook{margin:11px 0 0;font-size:16px;font-weight:800;letter-spacing:-.04em;color:#231f18;line-height:1.5;word-break:keep-all}
.bsteps{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.bstep{display:flex;align-items:flex-start;gap:9px;font-size:13.6px;line-height:1.6;color:#4a4438;word-break:keep-all}
.bstep .n{flex:0 0 20px;height:20px;border-radius:50%;background:#c19a2e;color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.bwin{margin-top:13px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.75);
  border:1px solid rgba(193,154,46,.28);font-size:13.6px;line-height:1.6;color:#4a4438;word-break:keep-all}
.bwin b{color:#a07c1c;font-weight:800}
.nvsline{stroke:rgba(193,154,46,.32);stroke-width:1}
.nvsdot{fill:#c9a227;transition:fill .18s,r .2s var(--spring)}
.nvst{font-size:11.5px;font-weight:600;letter-spacing:-.035em;fill:#6b6455;transition:fill .18s}
.nvsa{cursor:pointer}
.nvsa:hover .nvsdot{fill:#e0b93f}
.nvsa:hover .nvst{fill:#a07c1c}
.nvsa:active .nvsdot{fill:#8a6a10}
.nvsa.on .nvsdot{fill:#a07c1c}
.nvsa.on .nvst{fill:#8a6a10;font-weight:800}
.nvss{font-size:8.4px;font-weight:700;letter-spacing:-.045em;fill:#b8925f;transition:fill .18s}
.nvsa:hover .nvss{fill:#a07c1c}
.nvsa.on .nvss{fill:#a07c1c}
.nvsring{fill:none;stroke:rgba(193,154,46,.55);stroke-width:1.3}
.nvshit{fill:transparent}
.nvsbadge rect{fill:#c9a227}
.nvsbadge text{font-size:9.5px;font-weight:800;letter-spacing:-.02em;fill:#fffaf0}
.nvsa.on .nvsbadge rect{fill:#a07c1c}
.nvtline{stroke:rgba(193,154,46,.42);stroke-width:1;stroke-dasharray:3 3}
.nvtdot{fill:#d8b552;transition:fill .18s}
.nvtt{font-size:9.8px;font-weight:700;letter-spacing:-.05em;fill:#8a8271;transition:fill .18s}
.nvta{cursor:pointer}
.nvta:hover .nvtdot{fill:#c19a2e}
.nvta:hover .nvtt{fill:#a07c1c}
.nvtcap{font-size:8.6px;font-weight:700;letter-spacing:.06em;fill:#b4ab98}
/* 상단 내 사주 + 방문 통계 */
.subbar{border-bottom:1px solid rgba(150,120,40,.13);background:linear-gradient(180deg,rgba(255,253,247,.9),rgba(251,247,236,.6))}
.sbin{max-width:540px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:10px}
.biochip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:999px;
  font-size:12.5px;font-weight:600;letter-spacing:-.02em;color:#5f5849;white-space:nowrap;max-width:62%;
  background:#fff;border:1px solid rgba(60,48,16,.13);box-shadow:0 1px 2px rgba(70,56,20,.04);
  transition:transform .25s var(--spring),border-color .18s}
.biochip:active{transform:scale(.96)}
.biochip .bh{width:21px;height:21px;flex:0 0 21px;border-radius:7px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;line-height:1}
.biochip .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biochip .bg{color:var(--dim2);font-weight:500;font-size:11.5px}
.biochip .bx{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:-.03em;color:#a07c1c;
  background:var(--gold-soft);border-radius:999px;padding:2px 7px}
.biochip.empty{border-color:rgba(193,154,46,.5);background:linear-gradient(180deg,#fdf6e2,#fffdf7);color:#8a6a10;
  padding:5px 13px;font-weight:700}
.needbio{margin-left:auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:-.02em;
  color:#5a4408;background:linear-gradient(180deg,#f6e3a8,#e2c66a);border:1px solid rgba(160,124,28,.35);
  box-shadow:0 2px 8px rgba(190,150,50,.26)}
.needbio.pulse{animation:nbp 1.5s var(--ease) 3}
@keyframes nbp{0%,100%{transform:scale(1)}18%{transform:scale(1.07)}36%{transform:scale(1)}}
.needbio i{font-style:normal;font-size:11px}
@media(prefers-reduced-motion:reduce){.needbio.pulse{animation:none}}
.hstat{margin-right:auto;display:flex;gap:11px;font-size:11.5px;color:var(--dim2);letter-spacing:-.02em;white-space:nowrap}
.hstat b{font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums}
@media(max-width:379px){ .logo span{display:none} .hstat{gap:8px} }
.nv{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
  font-size:13.5px;font-weight:600;letter-spacing:-.022em;color:#6b6455;white-space:nowrap;
  background:#fff;border:1px solid rgba(60,48,16,.13);
  box-shadow:0 1px 2px rgba(70,56,20,.04);
  transition:transform .25s var(--spring),background .18s,color .18s,border-color .18s}
.nv .i{font-size:12.5px;line-height:1}
.nv:active{transform:scale(.95)}
.nv:hover{border-color:rgba(193,154,46,.5);color:var(--gold2)}
.nv.on{background:linear-gradient(180deg,#f3ddA0,#d8b85c);color:#3a2c07;border-color:transparent;
  box-shadow:0 2px 10px rgba(190,150,50,.30)}
.nv.on:hover{color:#3a2c07}

/* ---------- 우주 패널 (별지도 전용) ---------- */
.sky{position:relative;margin:0 -6px;padding:14px 12px 16px;border-radius:26px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(130% 95% at 50% -12%, rgba(217,180,91,.20), transparent 58%),
    radial-gradient(90% 70% at 12% 88%, rgba(79,134,198,.16), transparent 62%),
    linear-gradient(180deg,#111a2e 0%,#0b1120 46%,#080b14 100%);
  border:1px solid rgba(217,180,91,.24);
  box-shadow:0 16px 44px rgba(30,24,8,.22),inset 0 1px 0 rgba(255,255,255,.07)}
.sky::before,.sky::after{content:'';position:absolute;inset:-10%;pointer-events:none;z-index:0}
.sky::before{
  background-image:
    radial-gradient(1.3px 1.3px at 24px 32px,rgba(255,255,255,.95),transparent),
    radial-gradient(1px 1px at 96px 74px,rgba(242,223,165,.95),transparent),
    radial-gradient(1.5px 1.5px at 158px 126px,rgba(207,224,255,.85),transparent),
    radial-gradient(1px 1px at 62px 168px,rgba(255,255,255,.75),transparent),
    radial-gradient(1.2px 1.2px at 196px 44px,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 132px 196px,rgba(242,223,165,.7),transparent);
  background-size:224px 210px;
  animation:twk 4.6s ease-in-out infinite alternate}
.sky::after{
  background-image:
    radial-gradient(1px 1px at 48px 18px,rgba(255,255,255,.8),transparent),
    radial-gradient(1.4px 1.4px at 172px 88px,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 108px 148px,rgba(207,224,255,.65),transparent),
    radial-gradient(1.1px 1.1px at 16px 118px,rgba(242,223,165,.6),transparent);
  background-size:186px 172px;
  animation:twk2 6.8s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.42}to{opacity:.95}}
@keyframes twk2{from{opacity:.85}to{opacity:.35}}
.sky>*{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.sky::before,.sky::after{animation:none}}

/* 금빛 섹션 */
.gold-sec{background:linear-gradient(160deg,#fdf5dd,#fffdf7 62%,#fff);
  border:1px solid rgba(193,154,46,.30);border-radius:24px;padding:24px 20px;
  box-shadow:0 1px 2px rgba(70,56,20,.05),0 10px 30px rgba(160,124,28,.08)}
.gold-sec h2{margin-bottom:6px}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(193,154,46,.5),transparent);margin:34px 0}
.statbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.statbox{background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:15px 12px;text-align:center;box-shadow:0 1px 2px rgba(70,56,20,.04)}
.statbox b{display:block;font-size:25px;font-weight:700;letter-spacing:-.045em;color:var(--gold2);
  font-variant-numeric:tabular-nums;line-height:1.1}
.statbox i{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:5px;white-space:nowrap}

/* ---------- 공통 ---------- */
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--gold-dim);text-transform:uppercase}
h1{font-size:clamp(33px,9vw,46px);line-height:1.14;font-weight:700;letter-spacing:-.042em;margin:16px 0 0;color:#1d1a14}
h2{font-size:24px;font-weight:700;letter-spacing:-.032em;margin:0 0 14px;color:#1d1a14}
.lead{color:var(--dim);font-size:16px;margin:18px 0 0;line-height:1.66;letter-spacing:-.018em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.sec{margin-top:52px}
.muted{color:var(--dim)}
.tiny{font-size:12.5px;line-height:1.6;color:var(--dim2)}
.center{text-align:center}
.gold{color:var(--gold2)}
hr.d{border:0;border-top:1px solid var(--line);margin:20px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
  padding:16px 22px;border-radius:16px;font-weight:700;font-size:17px;letter-spacing:-.022em;
  background:linear-gradient(180deg,#f0d590,#cda549);color:#33260a;
  box-shadow:0 6px 20px rgba(190,150,50,.28),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .32s var(--spring),box-shadow .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.965)}
.btn:disabled{opacity:.45;pointer-events:none;box-shadow:none}
.btn.sec2{background:#fff;border:1px solid var(--line2);color:#332e24;
  box-shadow:0 1px 2px rgba(70,56,20,.05);font-weight:600}
.btn.sec2:active{background:#faf6ea}
.btn.dark{background:#1d1a14;color:#fdf7e6;box-shadow:0 6px 20px rgba(30,24,8,.22)}

/* ---------- 폼 ---------- */
.field{margin-top:22px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:9px;letter-spacing:-.01em}
.inp{width:100%;min-height:52px;padding:15px 16px;background:#fff;border:1px solid var(--line2);
  border-radius:14px;outline:none;transition:.2s var(--ease);font-size:17px;letter-spacing:-.02em;color:#231f18}
.inp:focus{border-color:rgba(193,154,46,.7);background:#fffdf5;box-shadow:0 0 0 4px rgba(193,154,46,.14)}
.inp::placeholder{color:var(--dim2)}

/* ===== 별지도 ===== */
function layout(entries,AX,ORDER,pick){
  AX=AX||AXES;ORDER=ORDER||AXIS_ORDER;pick=pick||axOf;
  var by={};entries.forEach(function(e){var k=pick(e);if(!AX[k])k=ORDER[0];(by[k]=by[k]||[]).push(e);});
  var out=[];
  ORDER.forEach(function(k){
    var list=by[k];if(!list||!list.length)return;
    list=list.slice().sort(function(a,b){return b.score-a.score});
    var n=list.length,base=AX[k].angle;
    var span=Math.min(58,Math.max(16,n*13));
    list.forEach(function(it,i){
      var ang=base+(n===1?0:(i/(n-1)-.5)*span);
      out.push(Object.assign({},it,{ax:k,ang:ang,r:radiusOf(it.score)}));
    });
  });
  // 겹침 완화: 가까운 별끼리 접선 방향으로 밀어낸다
  for(var pass=0;pass<26;pass++){
    var moved=false;
    for(var a=0;a<out.length;a++)for(var b=a+1;b<out.length;b++){
      var A=out[a],B=out[b];
      var pa=pos(A),pb=pos(B);
      var dx=pb.x-pa.x,dy=pb.y-pa.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>=21)continue;
      var push=(21-d)/2;
      var da=push/Math.max(A.r,26)*57.3, db=push/Math.max(B.r,26)*57.3;
      var dir=((B.ang-A.ang+540)%360-180)>=0?1:-1;
      A.ang-=da*dir; B.ang+=db*dir;
      if(d<3){A.r=Math.max(40,A.r-3);B.r=Math.min(164,B.r+3);}
      moved=true;
    }
    if(!moved)break;
  }
  out.forEach(function(o){var q=pos(o);o.x=q.x;o.y=q.y;});
  return out;
}
/* 같은 오행끼리 선을 이어 별자리 모양을 만든다 (최소 신장 트리) */
function constLines(pts){
  var by={};pts.forEach(function(p){(by[p.elem]=by[p.elem]||[]).push(p);});
  var lines=[];
  Object.keys(by).forEach(function(k){
    var g=by[k];if(g.length<2)return;
    var used=[g[0]],rest=g.slice(1);
    while(rest.length){
      var bi=0,bj=0,bd=1e9;
      for(var i=0;i<used.length;i++)for(var j=0;j<rest.length;j++){
        var dx=used[i].x-rest[j].x,dy=used[i].y-rest[j].y,d=dx*dx+dy*dy;
        if(d<bd){bd=d;bi=i;bj=j;}
      }
      lines.push({a:used[bi],b:rest[bj],elem:Number(k)});
      used.push(rest[bj]);rest.splice(bj,1);
    }
  });
  return lines;
}
function pos(o){
  var rad=(o.ang-90)*Math.PI/180;
  return {x:180+Math.cos(rad)*o.r, y:180+Math.sin(rad)*o.r};
}
// 이름표 자리 잡기 (겹치면 반대편, 그래도 겹치면 생략)
function placeLabels(pts,limit,reserved,meId){
  var boxes=[{x:180,y:198,w:74,h:18}]; // 중심 라벨 영역
  (reserved||[]).forEach(function(b){boxes.push(b)});
  var sorted=pts.slice().sort(function(a,b){return b.score-a.score});
  var out={};
  sorted.forEach(function(p,idx){
    if(limit && idx>=limit) return;
    var nlen=p.name.length+(meId===p.id?3:0);
    var w=Math.max(18,nlen*8.4+3),h=12;
    var rr=p.score>=82?7:4.4;
    var cands=[{x:p.x,y:p.y+rr+10},{x:p.x,y:p.y-rr-4},
               {x:p.x+w/2+rr+4,y:p.y+4},{x:p.x-w/2-rr-4,y:p.y+4}];
    for(var i=0;i<cands.length;i++){
      var c=cands[i];
      if(c.x-w/2<-6||c.x+w/2>366||c.y<12||c.y>354)continue;
      var hit=boxes.some(function(bx){
        return Math.abs(bx.x-c.x)<(bx.w+w)/2+2 && Math.abs(bx.y-c.y)<(bx.h+h)/2+1;
      });
      if(!hit){boxes.push({x:c.x,y:c.y,w:w,h:h});out[p.id]=c;return;}
    }
  });
  return out;
}
/* 동심원 이름을 별과 겹치지 않는 방향에 놓는다 */
function placeRings(pts,AX,ORDER,RG){
  AX=AX||AXES;ORDER=ORDER||AXIS_ORDER;RG=RG||RINGS;
  var ax=ORDER.map(function(k){
    var rad=(AX[k].angle-90)*Math.PI/180;
    return {x:180+Math.cos(rad)*172, y:180+Math.sin(rad)*172, hw:AX[k].short.length*5.8+6};
  });
  var placed=[],out=[];
  function gap(x,y,hw,arr,extra){
    var d=1e9;
    arr.forEach(function(q){
      var qh=(q.hw||0)+(extra||0);
      var dx=Math.max(0,Math.abs((q.x!=null?q.x:0)-x)-hw-qh);
      var dy=Math.max(0,Math.abs(q.y-y)-9);
      d=Math.min(d,Math.sqrt(dx*dx+dy*dy));
    });
    return d;
  }
  RG.forEach(function(g){
    var rr=g.r-9,hw=g.name.length*4.9+5,best=null,bs=-1;
    for(var a=0;a<360;a+=4){
      var rad=(a-90)*Math.PI/180;
      var x=180+Math.cos(rad)*rr, y=180+Math.sin(rad)*rr;
      if(x-hw<-18||x+hw>358||y<16||y>350)continue;
      var d=Math.min(
        gap(x,y,hw,pts,6),
        gap(x,y,hw,ax,4),
        gap(x,y,hw,[{x:180,y:203,hw:38}],2),
        placed.length?gap(x,y,hw,placed,6):1e9
      );
      if(d>bs){bs=d;best={x:x,y:y,hw:hw,name:g.name};}
    }
    if(best){placed.push(best);out.push(best);}
  });
  return out;
}

var AD_LAST=null;
function pickAd(topic){
  var pool=ADS.filter(function(a){return !a.topics||!topic||a.topics.indexOf(topic)>=0;});
  if(!pool.length)pool=ADS.slice();
  if(!pool.length)return null;
  if(pool.length>1&&AD_LAST){
    var f=pool.filter(function(a){return a.id!==AD_LAST;});
    if(f.length)pool=f;
  }
  var tot=0;pool.forEach(function(a){tot+=(a.weight||1)});
  var r=Math.random()*tot, a=pool[0];
  for(var i=0;i<pool.length;i++){ r-=(pool[i].weight||1); if(r<=0){a=pool[i];break;} }
  AD_LAST=a.id;
  return a;
}

var AD_SEEN={};
function bindAds(){
  var boxes=[].slice.call(app.querySelectorAll('.adbox[data-ad]'));
  if(!boxes.length)return;
  boxes.forEach(function(bx){
    bx.addEventListener('click',function(){ adPing('click',bx.dataset.ad,bx.dataset.adtopic); });
  });
  if(!('IntersectionObserver' in window)){
    boxes.forEach(function(bx){ adPing('view',bx.dataset.ad,bx.dataset.adtopic); });
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var bx=e.target, k=bx.dataset.ad+'|'+location.pathname;
      if(!AD_SEEN[k]){ AD_SEEN[k]=1; adPing('view',bx.dataset.ad,bx.dataset.adtopic); }
      io.unobserve(bx);
    });
  },{threshold:.5});
  boxes.forEach(function(bx){io.observe(bx)});
}

      .catch(function(){toast(t)});

  i.select();try{document.execCommand('copy');toast(msg||'복사했어요')}catch(e){toast(t)}

function starMap(entries,owner,opt){
  opt=opt||{};
  var AX=opt.axes||AXES, ORDER=opt.order||AXIS_ORDER, RG=opt.rings||RINGS;
  var pts=layout(entries,AX,ORDER,opt.pick);
  var reserved=[];
  ORDER.forEach(function(k){
    var A=AX[k],rad=(A.angle-90)*Math.PI/180,R=172;
    reserved.push({x:180+Math.cos(rad)*R, y:180+Math.sin(rad)*R, w:A.short.length*11+8, h:18});
  });
  var ringLabels=placeRings(pts,AX,ORDER,RG);
  ringLabels.forEach(function(g){
    reserved.push({x:g.x, y:g.y, w:g.hw*2+6, h:15});
  });
  var labels=placeLabels(pts, pts.length>34?14:0, reserved, opt.me);
  if(opt.sel!=null&&!labels[opt.sel]){
    var sp=pts.filter(function(x){return x.id===opt.sel})[0];
    if(sp)labels[opt.sel]={x:sp.x,y:sp.y-11};
  }
  var s='<svg viewBox="-26 -16 412 412" role="img" aria-label="인연 별자리 지도">';
  s+='<defs>'+
     '<radialGradient id="og"><stop offset="0%" stop-color="#fff8e0"/><stop offset="45%" stop-color="#f2dfa5"/><stop offset="100%" stop-color="#d9b45b" stop-opacity="0"/></radialGradient>'+
     '<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
     '</defs>';
  // 동심원 + 거리 이름
  RG.forEach(function(g,i){
    s+='<circle cx="180" cy="180" r="'+g.r+'" fill="none" stroke="rgba(255,255,255,'+(0.10-i*0.014).toFixed(3)+')" stroke-width="1"'+(i===RG.length-1?' stroke-dasharray="2 4"':'')+'/>';
  });
  // 자리 구분선
  ORDER.forEach(function(k){
    var rad=(AX[k].angle-90)*Math.PI/180;
    s+='<line x1="180" y1="180" x2="'+(180+Math.cos(rad)*162).toFixed(1)+'" y2="'+(180+Math.sin(rad)*162).toFixed(1)+'" stroke="rgba(255,255,255,.05)" stroke-width="1"/>';
  });
  // 다섯 자리 이름
  ORDER.forEach(function(k){
    var A=AX[k],rad=(A.angle-90)*Math.PI/180,R=172;
    var x=180+Math.cos(rad)*R, y=180+Math.sin(rad)*R;
    s+='<text class="dirlabel" x="'+x.toFixed(1)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="middle" fill="'+A.col+'" opacity=".95">'+A.short+'</text>';
  });
  // 거리 이름 (별과 겹치지 않는 방향에 자동 배치)
  ringLabels.forEach(function(g){
    s+='<text class="ringlabel" x="'+g.x.toFixed(1)+'" y="'+(g.y+3).toFixed(1)+'" text-anchor="middle">'+g.name+'</text>';
  });
  // 같은 오행끼리 잇는 별자리 선
  constLines(pts).forEach(function(L){
    s+='<line x1="'+L.a.x.toFixed(1)+'" y1="'+L.a.y.toFixed(1)+'" x2="'+L.b.x.toFixed(1)+'" y2="'+L.b.y.toFixed(1)+'" stroke="'+ECOL[L.elem]+'" stroke-opacity=".34" stroke-width="1"/>';
  });
  // 중심에서 뻗는 선
  pts.forEach(function(p){
    var isMe=(opt.me===p.id);
    s+='<line x1="180" y1="180" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="'+(isMe?'#f2dfa5':AX[p.ax].col)+'" stroke-opacity="'+(isMe?0.95:(0.07+p.score/700)).toFixed(3)+'" stroke-width="'+(isMe?2.2:1)+'"'+(isMe?' stroke-dasharray="3 2.5"':'')+'/>';
  });
  // 중심(주인)
  s+='<circle cx="180" cy="180" r="26" fill="url(#og)" opacity=".5"/>';
  s+='<circle cx="180" cy="180" r="9.5" fill="#f7ecc8" filter="url(#gl)"/>';
  s+='<text x="180" y="184" text-anchor="middle" font-size="9" font-weight="800" fill="#20180a">'+esc(owner.han)+'</text>';
  s+='<text x="180" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#f7e6ae" letter-spacing="-.02em" paint-order="stroke" stroke="rgba(6,9,16,.9)" stroke-width="3.4" stroke-linejoin="round">'+esc(owner.name)+'</text>';
  // 참여자 별
  pts.forEach(function(p,i){
    var big=p.score>=82,rr=big?5.2:(p.score>=68?4.2:3.4);
    s+='<g class="star" data-id="'+p.id+'">';
    if(big){
      s+='<path d="M'+p.x.toFixed(1)+' '+(p.y-9).toFixed(1)+'l2.1 6.9 6.9 2.1-6.9 2.1-2.1 6.9-2.1-6.9-6.9-2.1 6.9-2.1z" fill="'+ECOL[p.elem]+'" opacity=".95" filter="url(#gl)"/>';
    }else{
      s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+rr+'" fill="'+ECOL[p.elem]+'" filter="url(#gl)"/>';
    }
    if(p.cheoneul)s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(rr+4)+'" fill="none" stroke="#f2dfa5" stroke-width="1" opacity=".75"/>';
    if(opt.me===p.id){
      s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(rr+7)+'" fill="none" stroke="#f2dfa5" stroke-width="1.6" opacity=".9"/>';
      s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(rr+12)+'" fill="none" stroke="#f2dfa5" stroke-width="1" opacity=".35"/>';
    }
    var L=labels[p.id];
    if(L) s+='<text class="namelabel'+(opt.sel===p.id||opt.me===p.id?' on':'')+'" x="'+L.x.toFixed(1)+'" y="'+L.y.toFixed(1)+'" text-anchor="middle">'+(opt.me===p.id?'나 · ':'')+esc(p.name)+'</text>';
    s+='<circle class="hit" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="15"/></g>';
  });
  if(!pts.length){
    s+='<text x="180" y="252" text-anchor="middle" font-size="11.5" fill="#5d6579">아직 아무도 없어요. 링크를 보내보세요.</text>';
  }
  s+='</svg>';
  return s;
}

/* ===== 결과 카드 이미지 ===== */
function drawCard(r){
  var W=1080,H=1350,c=document.createElement('canvas');
  c.width=W;c.height=H;var x=c.getContext('2d');
  var res=r.result,b=band(res.score);
  var to=TYPES[res.typeIn],ti=TYPES[res.typeOut]; // 방문자 관점 (to: 내가 상대에게 / ti: 상대가 나에게)
  var cme=charBy(res.charB),cow=charBy(res.charA);
  var SC={gold:'#f2dfa5',green:'#8fd6ac',blue:'#93bdea',gray:'#c3ccdd',amber:'#e8c07a',red:'#f0998c'}[b.tone];
  var F="-apple-system,BlinkMacSystemFont,'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";

  var g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1020');g.addColorStop(.5,'#0a0f1c');g.addColorStop(1,'#080b14');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  var rg=x.createRadialGradient(W/2,240,0,W/2,240,760);
  rg.addColorStop(0,'rgba(217,180,91,.16)');rg.addColorStop(1,'rgba(217,180,91,0)');
  x.fillStyle=rg;x.fillRect(0,0,W,H);

  var sd=res.score*7919+1;
  function rnd(){sd=(sd*1103515245+12345)%2147483648;return sd/2147483648;}
  for(var i=0;i<260;i++){
    var px=rnd()*W,py=rnd()*H,pr=rnd()*2.4+.6;
    x.globalAlpha=.18+rnd()*.55;
    x.fillStyle=rnd()<.2?'#f2dfa5':'#cfe0ff';
    x.beginPath();x.arc(px,py,pr,0,6.284);x.fill();
  }
  x.globalAlpha=1;

  x.textAlign='center';
  x.fillStyle='#b0913f';x.font='600 30px '+F;
  x.fillText('因 緣 地 圖   인 연 지 도',W/2,120);

  x.fillStyle='#8a92a6';x.font='500 34px '+F;
  x.fillText(r.me.name+'  ×  '+r.ownerName,W/2,214);

  x.fillStyle=SC;x.font='700 210px '+F;
  x.shadowColor='rgba(242,223,165,.28)';x.shadowBlur=48;
  x.fillText(String(res.score),W/2,400);
  x.shadowBlur=0;
  x.fillStyle='#8a92a6';x.font='600 38px '+F;
  x.fillText(b.label,W/2,468);

  // 두 캐릭터
  function orb(cx,cy,ch,label,sub){
    x.beginPath();x.arc(cx,cy,62,0,6.284);
    x.fillStyle=ch.color+'2e';x.fill();
    x.lineWidth=2;x.strokeStyle=ch.color+'88';x.stroke();
    x.fillStyle=ch.color;x.font='600 52px '+F;x.fillText(ch.han,cx,cy+19);
    x.fillStyle='#8a92a6';x.font='500 25px '+F;x.fillText(label,cx,cy+108);
    x.fillStyle='#e9e5db';x.font='600 32px '+F;x.fillText(sub,cx,cy+150);
  }
  orb(W/2-215,640,cme,'나',cme.name);
  orb(W/2+215,640,cow,r.ownerName+'님',cow.name);
  x.strokeStyle='rgba(217,180,91,.45)';x.lineWidth=2;
  x.beginPath();x.moveTo(W/2-128,640);x.lineTo(W/2+128,640);x.stroke();
  x.fillStyle='#d9b45b';x.font='600 34px '+F;
  x.fillText('↔',W/2,652);

  // 유형 카드
  function card(y,label,name,color,text){
    var pad=88,w=W-pad*2,hh=196;
    x.beginPath();
    if(x.roundRect)x.roundRect(pad,y,w,hh,34);else x.rect(pad,y,w,hh);
    x.fillStyle='rgba(255,255,255,.045)';x.fill();
    x.lineWidth=1.5;x.strokeStyle='rgba(255,255,255,.10)';x.stroke();
    x.textAlign='left';
    x.fillStyle='#8a92a6';x.font='600 24px '+F;x.fillText(label,pad+40,y+56);
    x.fillStyle=color;x.font='700 46px '+F;x.fillText(name,pad+40,y+116);
    x.fillStyle='#a8b0c2';x.font='500 26px '+F;
    x.fillText(text.length>30?text.slice(0,29)+'…':text,pad+40,y+162);
    x.textAlign='center';
  }
  card(880,'나는 '+r.ownerName+'님에게',to.name,to.color,to.out.split('.')[0]+'.');

  x.fillStyle='#5d6579';x.font='500 25px '+F;
  x.fillText(location.host,W/2,1315);
  return c;
}
function saveCard(r){
  var c;
  try{c=drawCard(r);}catch(e){toast('이미지를 만들지 못했어요');return;}
  var name='인연지도_'+r.me.name+'_'+r.result.score+'점.png';
  c.toBlob(function(blob){
    if(!blob){toast('이미지를 만들지 못했어요');return;}
    var file=null;
    try{file=new File([blob],name,{type:'image/png'});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'인연지도'}).catch(function(){});
      return;
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    toast('이미지를 저장했어요');
  },'image/png');
}

function birthPrefill(extra){
  var b=getBirth(), o=extra||{};
  if(b&&!b.birth&&b.pending)b={name:b.name,birth:b.pending};
  if(b&&b.birth){
    o.name=b.name||''; o.y=b.birth.y; o.m=b.birth.m; o.d=b.birth.d;
    o.hour=b.birth.unknownTime?null:b.birth.hour;
    o.lunar=!!b.birth.lunar;
    o.gender=b.birth.gender||null;
  }
  return o;
}

function bindQuick(onGo){
  var g=el('qgo'); if(g)g.onclick=function(){
    var a=el('qAgree'), er=el('qErr');
    if(a&&!a.checked){ if(er)er.textContent='동의에 체크해 주세요.'; a.closest('.consent').scrollIntoView({block:'center',behavior:'smooth'}); return; }
    if(er)er.textContent='';
    tap();onGo();
  };
  var e=el('qedit'); if(e)e.onclick=function(){
    tap();
    var q=el('quickBox'); if(q)q.hidden=true;
    var f=el('fwrap'); if(f){f.hidden=false;f.scrollIntoView({behavior:'smooth',block:'center'});}
  };
}

  return '<div class="whobar"><span class="w1">'+
      '<b>'+esc(b.name||'내')+'</b>님 · '+d.y+'.'+d.m+'.'+d.d+

  app.innerHTML='<div class="skel" style="height:40px;width:55%;margin-top:34px"></div>'+
    '<div class="skel" style="height:260px;margin-top:20px"></div>';

        '<button class="btn" style="margin-top:20px" onclick="location.href=\'/\'">홈으로</button></section>';

function tMapOpt(t,extra){
  var T=TP(t);
  var o={axes:T.axes,order:T.order,rings:T.rings,pick:function(e){return e.axis||T.order[0]}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}
function tLegend(t){ var T=TP(t); return mapLegend(T.axes,T.order,T.rings); }
function tCenter(t){ var T=TP(t); return {han:T.han,name:T.center}; }
function tTone(b){
  return {gotgan:'gold',doneun:'green',ssuneun:'blue',saram:'gray',ssiat:'amber',
          gipeun:'gold',sunhwan:'green',bogotong:'blue',honja:'gray',jaram:'amber',
          jeongsang:'gold',oreum:'green',dajim:'blue',jaebae:'gray',junbi:'amber'}[b]||'gray';
}

    var T=TOPICS[k];

function doRoomShare(code,title,topic){
  var url=location.origin+'/w/'+code, T=TP(topic);
  var t=(title||T.label);
  if(window.Kakao&&window.Kakao.isInitialized&&window.Kakao.isInitialized()){
    try{
      window.Kakao.Share.sendDefault({objectType:'feed',
        content:{title:t+' · '+T.label,description:T.shareTxt,imageUrl:location.origin+'/og-'+topic+'.png',
          imageWidth:1200,imageHeight:630,link:{mobileWebUrl:url,webUrl:url}},
        buttons:[{title:'내 별 찍기',link:{mobileWebUrl:url,webUrl:url}}]});
      sharePing('room:'+topic,'kakao');
      return;
    }catch(e){}
  }
  if(navigator.share){sharePing('room:'+topic,'webshare');navigator.share({title:t,text:T.shareTxt,url:url}).catch(function(){});return;}
  sharePing('room:'+topic,'copy');
  copyText(url,'링크를 복사했어요');
}
function bindRoomShare(code,title,topic){
  var c=el('rcpy');if(c)c.onclick=function(){tap();sharePing('copy_room:'+topic,'copy');copyText(location.origin+'/w/'+code,'링크를 복사했어요');};

}

function tailPts(){
  // 왼쪽(건강)에서 오른쪽(말년)으로 읽히고, 오른쪽 끝이 분야별 풀이 별과 이어진다
  var out=[],n=NAVTAIL.length;
  for(var i=0;i<n;i++){
    var t=i/(n-1);
    var x=26+t*310;
    var y=254-Math.sin(t*Math.PI)*10-t*6;
    out.push({x:x,y:y,k:NAVTAIL[i].k,t:NAVTAIL[i].t});
  }
  return out;
}

/* ===== 기기 이동: 휴대폰 → PC =====
   내 사주와 내가 만든 지도 목록은 기기(localStorage)에만 있다.
   1회용 6자리 코드로 옮긴다. 15분 만료, 한 번 읽으면 서버에서 삭제. */
var HANDOFF_KEYS=['inbokdo_birth','inbokdo_mine','inbokdo_joined','inbokdo_myroom'];
function handoffBox(){
  return '<div class="card">'+
    '<div class="eyebrow" style="color:#c9a227">기기 옮기기</div>'+
    '<b style="display:block;font-size:19px;font-weight:700;letter-spacing:-.035em;margin-top:8px">'+
      '휴대폰에서 하던 걸 PC에서 이어서</b>'+
    '<div class="tiny" style="margin-top:7px;line-height:1.7;color:var(--dim)">'+
      '내 사주와 내가 만든 지도는 <b style="color:#4a4438">그 기기에만</b> 저장됩니다. '+
      '아래에서 코드를 뽑아 다른 기기에 넣으면 그대로 넘어갑니다. '+
      '코드는 <b style="color:#4a4438">15분</b>만 살아 있고 한 번 쓰면 사라집니다.</div>'+
    '<button class="btn sec2" id="hoMake" style="margin-top:14px">이 기기에서 코드 뽑기</button>'+
    '<div id="hoOut" class="hocode" hidden></div>'+
    '<div style="margin-top:16px;padding-top:15px;border-top:1px solid rgba(60,48,16,.13)">'+
      '<b style="display:block;font-size:15px;letter-spacing:-.03em">다른 기기에서 뽑은 코드가 있다면</b>'+
      '<div class="linkrow" style="margin-top:10px">'+
        '<input id="hoIn" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여섯 자리 코드">'+
        '<button id="hoGo">가져오기</button></div>'+
      '<div class="err" id="hoErr"></div>'+
      '<div class="tiny" style="margin-top:8px;line-height:1.65">가져오면 이 기기에 저장된 내용은 새 것으로 바뀝니다.</div>'+
    '</div>'+
  '</div>';
}
function bindHandoff(){
  var mk=el('hoMake'), out=el('hoOut'), go=el('hoGo'), inp=el('hoIn'), er=el('hoErr');
  if(mk)mk.onclick=function(){
    tap();
    var pack={};
    HANDOFF_KEYS.forEach(function(k){ var v=store(k); if(v)pack[k]=v; });
    if(!Object.keys(pack).length){ if(out){out.hidden=false;out.innerHTML='<div class="tiny">아직 옮길 내용이 없어요. 생년월일을 먼저 넣어주세요.</div>';} return; }
    mk.innerHTML='<span class="spin"></span>'; mk.disabled=true;
    api('/api/handoff',{method:'POST',body:JSON.stringify({data:JSON.stringify(pack)})})
      .then(function(j){
        mk.disabled=false; mk.textContent='코드 다시 뽑기';
        out.hidden=false;
        out.innerHTML='<div class="hoc">'+esc(j.code)+'</div>'+
          '<div class="tiny" style="margin-top:8px;line-height:1.7">다른 기기에서 <b style="color:#4a4438">'+
          esc(location.host)+'/my</b> 를 열고 이 코드를 넣으세요. '+j.minutes+'분 안에 쓰셔야 합니다.</div>';
      })
      .catch(function(e){ mk.disabled=false; mk.textContent='이 기기에서 코드 뽑기';
        out.hidden=false; out.innerHTML='<div class="tiny">'+esc(e.message||'코드를 뽑지 못했어요.')+'</div>'; });
  };
  if(go)go.onclick=function(){
    var c=(inp.value||'').trim().toLowerCase().replace(/[^a-z2-9]/g,'');
    if(c.length!==6){ er.textContent='여섯 자리 코드를 넣어주세요.'; return; }
    er.textContent=''; go.innerHTML='<span class="spin"></span>'; go.disabled=true;
    api('/api/handoff/'+c,{method:'POST',body:'{}'})
      .then(function(j){
        var pack=JSON.parse(j.data);
        HANDOFF_KEYS.forEach(function(k){ if(pack[k]!==undefined)store(k,pack[k]); });
        toast('불러왔어요');
        setTimeout(function(){ location.href='/my'; },700);
      })
      .catch(function(e){ go.disabled=false; go.textContent='가져오기'; er.textContent=e.message||'가져오지 못했어요.'; });
  };
}

/* 이 기기에 이미 만든 인연지도가 있으면 가장 최근 것의 코드 */
function myMapCode(){
  var m=store('inbokdo_mine')||{};
  var ks=Object.keys(m);
  if(!ks.length)return null;
  ks.sort(function(a,b){ return (m[b]&&m[b].at||0)-(m[a]&&m[a].at||0); });
  return ks[0];
}

function getBirth(){
  var b=store('inbokdo_birth');
  if(!b) return b;
  // 성별이 없는 예전 기록은 미완성으로 본다 (대운·육친 계산에 반드시 필요)
  if(b.birth&&b.birth.gender!=='m'&&b.birth.gender!=='f'){
    return {name:b.name,charKey:b.charKey,pending:b.birth,needSex:true};
  }
  return b;
}

function deepPage(){
  var b=getBirth();
  if(!b||!b.birth) return needBirthView('내 사주팔자');
  app.innerHTML='<div class="skel" style="height:38px;width:58%;margin-top:34px"></div>'+
    '<div class="skel" style="height:22px;width:80%;margin-top:14px"></div>'+
    '<div class="skel" style="height:230px;margin-top:22px"></div>'+
    '<div class="skel" style="height:160px;margin-top:12px"></div>';
  api('/api/deep',{method:'POST',body:JSON.stringify({birth:b.birth})})
    .then(function(j){
      if(j.char&&b.charKey!==j.char.key){ b.charKey=j.char.key; store('inbokdo_birth',b); paintBio(); }
      renderDeep(j,b);
    })
    .catch(function(e){
      app.innerHTML='<section class="center" style="padding-top:60px"><h1 style="font-size:24px">'+esc(e.message)+'</h1>'+
        '<button class="btn" style="margin-top:20px" onclick="location.href=\'/my\'">사주 정보 확인하기</button></section>';
    });
}

function wonguk(D){
  var C=D.chart;
  var head='',sinT='',ganR='',jiR='',sinB='',hid='',un='';
  for(var i=0;i<4;i++){
    var c=C[i];
    head+='<th>'+esc(c.label)+'</th>';
    if(c.empty){
      sinT+='<td></td>';
      ganR+='<td rowspan="2"><div class="wempty">시간을<br>모릅니다</div></td>';
      sinB+='<td></td>';hid+='<td></td>';un+='<td></td>';
      continue;
    }
    var sc=ECOL_D[SELEM[c.stem]], bc=ECOL_D[BELEM[c.branch]];
    sinT+='<td><div class="wsin">'+esc(c.stemSipsin)+'</div></td>';
    ganR+='<td><div class="wbig" style="background:'+sc+'"><b>'+esc(c.stemHan)+'</b><s>'+esc(c.stemKo)+' '+esc(c.stemElem)+'</s></div></td>';
    jiR+='<td><div class="wbig" style="background:'+bc+'"><b>'+esc(c.branchHan)+'</b><s>'+esc(c.branchKo)+' '+esc(c.branchElem)+'</s></div></td>';
    sinB+='<td><div class="wsin">'+esc(c.branchSipsin)+(c.gongmang?'<span class="wgm">공망</span>':'')+'</div></td>';
    hid+='<td><div class="whid">'+c.hidden.map(function(x){return '<i>'+esc(x.han)+'</i> '+esc(x.sipsin);}).join('<br>')+'</div></td>';
    un+='<td><div class="wun">'+esc(c.unseong.name)+'<div class="tiny" style="font-weight:400;margin-top:1px">'+esc(c.unseong.han)+'</div></div></td>';
  }
  // 시주가 없으면 천간칸을 rowspan 처리했으므로 지지행에서 빼준다
  var hourEmpty=C[3].empty;
  if(hourEmpty){ jiR=jiR; }
  return '<div class="wg"><table class="wonguk">'+
    '<thead><tr>'+head+'</tr></thead><tbody>'+
    '<tr>'+sinT+'</tr>'+
    '<tr>'+ganR+'</tr>'+
    '<tr>'+jiR+(hourEmpty?'':'')+'</tr>'+
    '<tr>'+sinB+'</tr>'+
    '<tr>'+hid+'</tr>'+
    '<tr>'+un+'</tr>'+
    '</tbody></table></div>';
}

function sitem(name,han,at,text,color,good){
  var c=good>0?'#3f8f66':good<0?'#c05a3c':(color||'#c19a2e');
  return '<div class="sitem" style="--c:'+c+'">'+
    '<div class="h"><b>'+esc(name)+'</b>'+(han?'<u>'+esc(han)+'</u>':'')+
      (at?'<em>'+esc(at)+'</em>':'')+'</div>'+
    '<p>'+esc(text)+'</p></div>';
}

/* 가로 스크롤 영역 — 좌우로 더 있다는 걸 눈에 보이게 */
function bindHScroll(box,wrap){
  if(!box||!wrap)return;
  function upd(){
    var max=box.scrollWidth-box.clientWidth;
    wrap.classList.toggle('sc-l',box.scrollLeft>6);
    wrap.classList.toggle('sc-r',box.scrollLeft<max-6);
  }
  box.addEventListener('scroll',upd,{passive:true});
  window.addEventListener('resize',upd);
  setTimeout(upd,60);upd();
}

function dedupeRel(rel){
  var seen={},out=[];
  rel.forEach(function(r){ if(seen[r.k])return; seen[r.k]=1; out.push(r); });
  return out;
}

function bindJump(){
  var nav=el('jump');if(!nav)return;
  var links=[].slice.call(nav.querySelectorAll('a'));
  nav.addEventListener('click',function(e){
    var a=e.target.closest('a');if(!a)return;
    e.preventDefault();tap();
    var t=document.querySelector(a.getAttribute('href'));if(!t)return;
    var y=t.getBoundingClientRect().top+window.pageYOffset-108;
    window.scrollTo({top:y,behavior:'smooth'});
  });
  var ticking=false;
  function onScroll(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      var best=null,bd=1e9;
      links.forEach(function(a){
        var t=document.querySelector(a.getAttribute('href'));if(!t)return;
        var d=Math.abs(t.getBoundingClientRect().top-130);
        if(d<bd){bd=d;best=a;}
      });
      links.forEach(function(a){a.classList.toggle('on',a===best);});
      if(best){
        var l=best.offsetLeft-nav.clientWidth/2+best.offsetWidth/2;
        nav.scrollTo({left:Math.max(0,l),behavior:'smooth'});
      }
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
}

  var max=Math.max.apply(null,d.map(val)) || 1;
  var bw=Math.max(2,(W-(d.length-1)*gap)/d.length);
  var bars=d.map(function(r,i){
    var v=val(r), h=Math.max(1,v/max*(H-16));
    return '<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
      '" rx="1.5" fill="'+(color||'#c19a2e')+'"><title>'+admEsc(r.day)+' · '+admN(v)+'</title></rect>';

          '비밀번호는 서버에만 있고 화면 코드에는 들어 있지 않습니다.</p>'+
      '</div>'+
    '</section>'+
    '<section class="sec" id="admBody"></section>'));
  var go=el('admGo'), pw=el('admPw'), er=el('admErr');
  function login(){
    var v=(pw.value||'').trim();
    if(!v){ er.textContent='비밀번호를 넣어주세요.'; return; }
    er.textContent=''; go.innerHTML='<span class="spin"></span>'; go.disabled=true;
    api('/api/admin/login',{method:'POST',body:JSON.stringify({pw:v})})
      .then(function(){ pw.value=''; loadAdmin(); })
      .catch(function(e){ go.disabled=false; go.textContent='들어가기'; er.textContent=e.message; });
  }
  go.onclick=function(){tap();login();};
  pw.addEventListener('keydown',function(e){ if(e.key==='Enter')login(); });
  // 이미 로그인돼 있으면 바로 연다
  loadAdmin(true);
  window.scrollTo(0,0);
}
function loadAdmin(silent){
  var days=(window.__admDays||30);
  var body=el('admBody'); if(!body)return;
  if(!silent) body.innerHTML='<div class="skel" style="height:240px;margin-top:20px"></div>';
  api('/api/admin/stats?days='+days)
    .then(function(j){ var lg=el('admLogin'); if(lg)lg.hidden=true; renderAdmin(j); })
    .catch(function(e){
      if(silent) return;
      var lg=el('admLogin'); if(lg)lg.hidden=false;
      body.innerHTML='<div class="card"><b>'+admEsc(e.message)+'</b></div>';
      var g=el('admGo'); if(g){g.disabled=false;g.textContent='들어가기';}
    });
}

function admTable(rows,kind){
  if(!rows||!rows.length) return '<p class="tiny" style="margin:6px 0 0">아직 없습니다.</p>';
  var TN={wealth:'재물',love:'연애',work:'일운'};
  return '<div class="hscroll"><table class="admtb"><thead><tr>'+
    '<th>'+(kind==='map'?'주인':'방 이름')+'</th><th>코드</th><th>인원</th><th>만든 날</th><th></th></tr></thead><tbody>'+
    rows.map(function(r){
      var nm = kind==='map' ? (r.owner_name||'-') : ((TN[r.topic]||r.topic)+' · '+(r.title||'-'));
      var href = kind==='map' ? ('/m/'+r.code) : ('/w/'+r.code);
      return '<tr><td>'+admEsc(nm)+'</td>'+
        '<td><a href="'+href+'" target="_blank" rel="noopener">'+admEsc(r.code)+'</a></td>'+
        '<td>'+admN(r.n)+'</td><td>'+admDate(r.created_at)+'</td>'+
        '<td><button class="admdel" data-del="'+admEsc(r.code)+'" data-kind="'+kind+'">삭제</button></td></tr>';
    }).join('')+'</tbody></table></div>';
}

function scrollToArea(){
  var want=(location.hash||'').replace('#','');
  if(!want)return false;
  var card=document.getElementById('area-'+want);
  if(!card)return false;
  card.classList.remove('rv');card.style.opacity=1;card.style.transform='none';
  window.scrollTo({top:card.getBoundingClientRect().top+window.pageYOffset-78,behavior:'smooth'});
  card.classList.add('hit');
  setTimeout(function(){card.classList.remove('hit');},2200);
  return true;
}
window.addEventListener('hashchange',function(){ scrollToArea(); });
